<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Student Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body data-page="account">

  <main class="wireframe">

    <!-- Header -->
    <header>
      <b>Campus FoodLink+</b>

      <nav>
        <a href="menu.html">Place Order</a>
        <button id="studentLogoutBtn" type="button">Logout</button>
      </nav>
    </header>


    <!-- Student Account Information -->
    <section class="panel">

      <h2>Student Account</h2>

      <p>
        Name:
        <b id="studentName"></b>
      </p>

      <p>
        Email:
        <span id="studentEmail"></span>
      </p>

      <p>
        Meal Plan Balance:
        $<b id="balance"></b>
      </p>

      <!-- Only displayed during Professor Demo -->
      <button id="returnStaffBtn" type="button" hidden>
        Return to Staff
      </button>

    </section>


    <!-- Latest Order -->
    <section class="panel">

      <h2>Latest Order</h2>

      <p>
        Order #:
        <b id="orderId">No Current Order</b>
      </p>

      <p>
        Vendor:
        <span id="orderVendor">-</span>
      </p>

      <p>
        Status:
        <span id="orderStatus">-</span>
      </p>

      <p>
        Updated:
        <span id="statusUpdated">-</span>
      </p>

      <button id="cancelOrderBtn" type="button">
        Cancel Order
      </button>

      <p id="accountMessage" aria-live="polite"></p>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
