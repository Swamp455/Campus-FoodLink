<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Student Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body data-page="account">

  <main class="wireframe">

    <header>

      <b>Campus FoodLink+</b>

      <nav class="student-nav">

        <a
          href="menu.html"
          class="header-button">
          Place Order
        </a>

        <button
          id="studentLogoutBtn"
          class="header-button"
          type="button">
          Logout
        </button>

      </nav>

    </header>


    <section class="panel">

      <h2>Student Account</h2>

      <p>
        Name:
        <b id="studentName"></b>
      </p>

      <p>
        Email:
        <span id="studentEmail"></span>
      </p>

      <p>
        Meal Plan Balance:
        $<span id="balance"></span>
      </p>

      <button
        id="returnStaffBtn"
        type="button"
        hidden>
        Return to Staff Dashboard
      </button>

    </section>


    <section class="panel">

      <h2>Latest Order</h2>

      <p>
        Order #:
        <b id="orderId">-</b>
      </p>

      <p>
        Vendor:
        <span id="orderVendor">-</span>
      </p>

      <p>
        Status:
        <b id="orderStatus">-</b>
      </p>

      <p>
        Last Updated:
        <span id="statusUpdated">-</span>
      </p>

      <button
        id="cancelOrderBtn"
        type="button">
        Cancel Order
      </button>

      <p
        id="accountMessage"
        aria-live="polite">
      </p>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
