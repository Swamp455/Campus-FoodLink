<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Student Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body data-page="account">

  <main class="wireframe">

    <!-- Header -->
    <header>
      <b>Campus FoodLink+</b>

      <nav>
        <a href="menu.html">Place Order</a>
        <a href="index.html" id="studentLogout">Logout</a>
      </nav>
    </header>


    <!-- Student Account -->
    <section class="panel">

      <h2>Student Account</h2>

      <p>
        <strong>Name:</strong>
        <span id="studentName"></span>
      </p>

      <p>
        <strong>Email:</strong>
        <span id="studentEmail"></span>
      </p>

      <p>
        <strong>Meal Plan Balance:</strong>
        $<span id="balance">0.00</span>
      </p>

      <!-- Only displayed during Professor Demo mode -->
      <button
        id="returnStaffBtn"
        type="button"
        hidden>
        Return to Staff Dashboard
      </button>

    </section>


    <!-- Latest Order -->
    <section class="panel">

      <h2>Latest Order</h2>

      <p>
        <strong>Order #:</strong>
        <span id="orderId">No Current Order</span>
      </p>

      <p>
        <strong>Vendor:</strong>
        <span id="orderVendor">-</span>
      </p>

      <p>
        <strong>Status:</strong>
        <span id="orderStatus">-</span>
      </p>

      <p>
        <strong>Last Updated:</strong>
        <span id="statusUpdated">-</span>
      </p>

      <button
        id="cancelOrderBtn"
        type="button">
        Cancel Order
      </button>

      <p
        id="accountMessage"
        aria-live="polite">
      </p>

    </section>

  </main>

  <script src="app.js"></script>

</body>

</html>
