<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Student Dashboard
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body data-page="account">

  <main class="wireframe">


    <!-- =====================================================
         STUDENT DASHBOARD HEADER
         ===================================================== -->

    <header class="student-head">


      <!-- NAVIGATION MENU -->

      <button
        class="hamburger"
        type="button"
        aria-label="Menu"
      >
        ☰
      </button>


      <!-- SCHOOL LOGO -->

      <span class="school-logo">
        School Logo
      </span>


      <!-- SEARCH -->

      <span class="search">
        ⌕
      </span>


    </header>


    <!-- =====================================================
         STUDENT PROFILE
         ===================================================== -->

    <section class="profile-row">


      <!-- STUDENT AVATAR -->

      <div class="avatar">
        ●
      </div>


      <!-- STUDENT INFORMATION -->

      <div>

        <p>

          <b>
            Name:
          </b>

          <span id="studentName">
            [DATA NEEDED HERE]
          </span>

        </p>


        <p>

          <b>
            Balance:
          </b>

          $

          <span id="balance">
            [DATA NEEDED HERE]
          </span>

        </p>

      </div>


      <!-- PLACE ORDER -->

      <a
        class="small-button"
        href="menu.html"
      >
        Place Order
      </a>


    </section>


    <!-- =====================================================
         CURRENT ORDER
         ===================================================== -->

    <section class="current-order">

      <h2>
        Current Order
      </h2>


      <!-- ORDER NUMBER -->

      <p>

        <b>
          Order #:
        </b>

        <span id="orderId">
          [DATA NEEDED HERE]
        </span>

      </p>


      <!-- VENDOR -->

      <p>

        <b>
          Vendor:
        </b>

        <span id="orderVendor">
          [DATA NEEDED HERE]
        </span>

      </p>


      <!-- ORDER STATUS -->

      <p>

        <b>
          Status:
        </b>

        <span id="orderStatus">
          [DATA NEEDED HERE]
        </span>

      </p>


    </section>


  </main>


  <!-- =======================================================
       CAMPUS FOODLINK+ JAVASCRIPT
       ======================================================= -->

  <script src="app.js"></script>


</body>

</html>
