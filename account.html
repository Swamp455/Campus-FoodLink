<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Student Dashboard
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body data-page="account">

  <main class="wireframe">


    <!-- =====================================================
         STUDENT HEADER
         ===================================================== -->

    <header class="student-head">

      <button
        class="hamburger"
        type="button"
        aria-label="Menu"
      >
        ☰
      </button>


      <span class="school-logo">
        Campus FoodLink+
      </span>


      <span class="search">
        ⌕
      </span>

    </header>


    <!-- =====================================================
         STUDENT PROFILE
         ===================================================== -->

    <section class="profile-row">


      <!-- AVATAR -->

      <div class="avatar">
        ●
      </div>


      <!-- STUDENT INFORMATION -->

      <div>

        <p>

          <b>
            Name:
          </b>

          <span id="studentName">
            [DATA NEEDED HERE]
          </span>

        </p>


        <p>

          <b>
            Balance:
          </b>

          $

          <span id="balance">
            [DATA NEEDED HERE]
          </span>

        </p>


        <!-- ADD FUNDS -->

        <button
          id="addFundsBtn"
          type="button"
          class="small-button"
        >
          Add Funds
        </button>

      </div>


      <!-- PLACE ORDER -->

      <a
        class="small-button"
        href="menu.html"
      >
        Place Order
      </a>


    </section>


    <!-- =====================================================
         CURRENT ORDER
         ===================================================== -->

    <section class="current-order">

      <h2>
        Current Order
      </h2>


      <p>

        <b>
          Order #:
        </b>

        <span id="orderId">
          No Current Order
        </span>

      </p>


      <p>

        <b>
          Vendor:
        </b>

        <span id="orderVendor">
          -
        </span>

      </p>


      <p>

        <b>
          Status:
        </b>

        <span id="orderStatus">
          -
        </span>

      </p>


      <!-- CANCEL ORDER -->

      <button
        id="cancelOrderBtn"
        type="button"
        class="small-button"
      >
        Cancel Order
      </button>


      <!-- STATUS MESSAGE -->

      <p
        id="accountMessage"
        aria-live="polite"
      ></p>


    </section>


  </main>


  <script src="app.js"></script>

</body>

</html>
