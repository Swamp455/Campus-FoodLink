<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Order Confirmation</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body data-page="confirmation">

  <main class="wireframe confirmation">

    <span class="school-logo">
      Campus FoodLink+
    </span>


    <!-- =================================================
         ORDER CONFIRMATION
         ================================================= -->

    <div class="confirmation-copy">

      <p>

        Your Order #

        <b id="confirmOrder">
          [DATA NEEDED HERE]
        </b>

        is

        <b id="confirmStatus">
          pending!
        </b>

      </p>


      <p>

        Pickup Time:

        <b id="confirmPickup">
          [DATA NEEDED HERE]
        </b>

      </p>

    </div>


    <!-- =================================================
         ACTIONS
         ================================================= -->

    <div class="confirm-actions">

      <button
        id="logoutBtn"
        type="button"
      >
        Logout
      </button>


      <a
        class="button"
        href="account.html"
      >
        Return to Dashboard
      </a>

    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>
