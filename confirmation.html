<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Order Confirmation
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body data-page="confirmation">

  <main class="wireframe confirmation">


    <!-- =====================================================
         SCHOOL LOGO
         ===================================================== -->

    <span class="school-logo">
      School Logo
    </span>


    <!-- =====================================================
         ORDER CONFIRMATION INFORMATION
         ===================================================== -->

    <div class="confirmation-copy">

      <p>

        Your Order #

        <b id="confirmOrder">
          [DATA NEEDED HERE]
        </b>,

        is being

        <b id="confirmStatus">
          prepared!
        </b>

      </p>


      <p>

        Pickup Time:

        <b id="confirmPickup">
          [DATA NEEDED HERE]
        </b>

      </p>

    </div>


    <!-- =====================================================
         CONFIRMATION ACTIONS
         ===================================================== -->

    <div class="confirm-actions">


      <!-- LOGOUT -->

      <button
        id="logoutBtn"
        type="button"
      >
        Logout
      </button>


      <!-- RETURN TO STUDENT DASHBOARD -->

      <a
        class="button"
        href="account.html"
      >
        Return to Dashboard
      </a>


    </div>


  </main>


  <!-- =======================================================
       CAMPUS FOODLINK+ JAVASCRIPT
       ======================================================= -->

  <script src="app.js"></script>


</body>

</html>
