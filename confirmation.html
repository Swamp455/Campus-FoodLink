<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Order Confirmation</title>

  <link rel="stylesheet" href="style.css">
</head>

<body data-page="confirmation">

  <main class="wireframe">

    <!-- Header -->
    <header>
      <b>Campus FoodLink+</b>
    </header>


    <!-- Order Confirmation -->
    <section class="panel confirmation">

      <h2>Order Confirmation</h2>

      <p>
        Your order has been successfully submitted.
      </p>

      <p>
        <strong>Order #:</strong>
        <span id="confirmOrder"></span>
      </p>

      <p>
        <strong>Vendor:</strong>
        <span id="confirmVendor"></span>
      </p>

      <p>
        <strong>Status:</strong>
        <span id="confirmStatus"></span>
      </p>

      <p>
        <strong>Pickup Time:</strong>
        <span id="confirmPickup"></span>
      </p>

      <p>
        <strong>Order Total:</strong>
        $<span id="confirmTotal">0.00</span>
      </p>


      <!-- Navigation -->
      <div class="confirm-actions">

        <a
          class="button"
          href="account.html">
          Return to Dashboard
        </a>

        <button
          id="logoutBtn"
          type="button">
          Logout
        </button>

      </div>

    </section>

  </main>

  <script src="app.js"></script>

</body>

</html>
