
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Order Confirmation | Campus FoodLink+</title>

  <link rel="stylesheet" href="style.css">
</head>

<body data-page="confirmation">

  <main class="wireframe confirmation confirmation-page">

    <!-- CAMPUS FOODLINK+ LOGO -->
    <div class="confirmation-branding">

      <img
        src="./Campus%20FoodLink%2B%20Logo.png"
        alt="Campus FoodLink+ Logo"
        class="confirmation-logo"
      >

    </div>

    <!-- ORDER CONFIRMATION CARD -->
    <section class="confirmation-card">

      <div class="confirmation-success">

        <div class="success-icon" aria-hidden="true">
          &#10003;
        </div>

        <h1>Order Submitted Successfully!</h1>

        <p class="confirmation-subtitle">
          Your campus dining order has been received.
        </p>

        <p class="confirmation-order-number">
          Order #<strong id="confirmOrder"></strong>
        </p>

      </div>

      <!-- ORDER SUMMARY -->
      <div class="order-summary">

        <h2>Order Summary</h2>

        <div class="confirmation-details">

          <div class="confirmation-detail">
            <span class="detail-label">Vendor</span>
            <strong id="confirmVendor"></strong>
          </div>

          <div class="confirmation-detail">
            <span class="detail-label">Order Status</span>
            <strong id="confirmStatus" class="status-badge"></strong>
          </div>

          <div class="confirmation-detail">
            <span class="detail-label">Pickup Time</span>
            <strong id="confirmPickup"></strong>
          </div>

          <div class="confirmation-detail total-detail">
            <span class="detail-label">Order Total</span>
            <strong class="confirmation-total">
              $<span id="confirmTotal"></span>
            </strong>
          </div>

        </div>

      </div>

      <p class="confirmation-note">
        You can monitor your order status from your
        Student Dashboard.
      </p>

      <!-- ACTION BUTTONS -->
      <div class="confirm-actions">

        <a class="button dashboard-return" href="account.html">
          Return to Dashboard
        </a>

        <button
          id="logoutBtn"
          class="confirmation-logout"
          type="button">
          Logout
        </button>

      </div>

    </section>

    <footer class="confirmation-footer">
      Campus FoodLink+ | IT499 Capstone Demonstration Prototype
    </footer>

  </main>

  <script src="app.js"></script>

</body>
</html>
