<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Dietary Associate Orders
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body data-page="orders">

  <main class="wireframe">


    <!-- =====================================================
         STAFF HEADER
         ===================================================== -->

    <header class="staff-head">

      <span id="staffVendor">
        Vendor Orders
      </span>


      <nav>

        <a href="orders.html">
          Dashboard
        </a>


        <a
          class="active"
          href="orders.html"
        >
          Orders
        </a>


        <a href="#">
          Inventory
        </a>


        <a href="#">
          Inbox
        </a>

      </nav>

    </header>


    <!-- =====================================================
         STAFF INFORMATION
         ===================================================== -->

    <p class="staff-welcome">

      Hello,

      <b id="staffName">
        [DATA NEEDED HERE]
      </b>,

      here are the recent orders.

    </p>


    <!-- =====================================================
         ORDERS
         ===================================================== -->

    <table class="orders-table">

      <thead>

        <tr>

          <th>
            Order #
          </th>

          <th>
            Vendor
          </th>

          <th>
            Status
          </th>

          <th>
            Date
          </th>

          <th>
            Pickup Time
          </th>

          <th>
            Notes
          </th>

          <th>
            Action
          </th>

        </tr>

      </thead>


      <tbody id="ordersBody">

        <!-- Loaded by app.js -->

      </tbody>

    </table>


    <!-- =====================================================
         SAVE MESSAGE
         ===================================================== -->

    <p
      id="saveMessage"
      aria-live="polite"
    ></p>


  </main>


  <script src="app.js"></script>

</body>

</html>
