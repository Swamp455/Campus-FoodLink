<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Staff Dashboard</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body data-page="orders">

  <main class="wireframe staff-dashboard">

    <header class="staff-head">

      <span id="staffVendor">
        Campus FoodLink+
      </span>

      <nav>

        <button
          id="showOrdersBtn"
          class="staff-nav active"
          type="button"
        >
          Orders
        </button>

        <button
          id="showInventoryBtn"
          class="staff-nav"
          type="button"
        >
          Inventory
        </button>

        <button
          id="studentDemoBtn"
          class="staff-nav"
          type="button"
          hidden
        >
          Student Demo
        </button>

        <button
          id="exportDataBtn"
          class="staff-nav"
          type="button"
        >
          Export Data
        </button>

        <button
          id="staffLogoutBtn"
          class="staff-nav"
          type="button"
        >
          Logout
        </button>

      </nav>

    </header>


    <p class="staff-welcome">

      Hello,

      <b id="staffName">
        [DATA NEEDED HERE]
      </b>,

      welcome to the staff dashboard.

    </p>


    <!-- ORDERS -->

    <section id="ordersSection">

      <h2 class="staff-section-title">
        Recent Orders
      </h2>

      <table class="orders-table">

        <thead>

          <tr>
            <th>Order #</th>
            <th>Vendor</th>
            <th>Status</th>
            <th>Date</th>
            <th>Pickup Time</th>
            <th>Notes</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody id="ordersBody"></tbody>

      </table>

      <p
        id="saveMessage"
        aria-live="polite"
      ></p>

    </section>


    <!-- INVENTORY -->

    <section
      id="inventorySection"
      hidden
    >

      <h2 class="staff-section-title">
        Menu Inventory
      </h2>

      <p class="inventory-description">
        View available menu items and update inventory quantities.
      </p>

      <table class="orders-table inventory-table">

        <thead>

          <tr>
            <th>Item ID</th>
            <th>Vendor</th>
            <th>Menu Item</th>
            <th>Price</th>
            <th>Inventory</th>
            <th>Available</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody id="inventoryBody"></tbody>

      </table>

      <p
        id="inventoryMessage"
        aria-live="polite"
      ></p>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
