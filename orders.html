<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Staff Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body data-page="orders">

  <main class="wireframe">

    <!-- Header -->
    <header>

      <b>Campus FoodLink+</b>

      <nav aria-label="Staff navigation">

        <button id="showOrdersBtn" type="button">
          Orders
        </button>

        <button id="showMenuBtn" type="button">
          Menu Availability
        </button>

        <button id="studentDemoBtn" type="button" hidden>
          Student Demo
        </button>

        <button id="exportDataBtn" type="button">
          Export JSON
        </button>

        <button id="staffLogoutBtn" type="button">
          Logout
        </button>

      </nav>

    </header>


    <!-- Staff Information -->
    <section class="panel staff-welcome">

      <p>
        Hello,
        <b id="staffName"></b>
        —
        <span id="staffRole"></span>
      </p>

    </section>


    <!-- Orders -->
    <section
      id="ordersSection"
      class="panel">

      <h2>Orders</h2>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th scope="col">Order #</th>
              <th scope="col">Student</th>
              <th scope="col">Vendor</th>
              <th scope="col">Latest Status</th>
              <th scope="col">Pickup</th>
              <th scope="col">New Status</th>
              <th scope="col">Details</th>
            </tr>
          </thead>

          <tbody id="ordersBody">
          </tbody>

        </table>

      </div>

      <p
        id="saveMessage"
        aria-live="polite">
      </p>

    </section>


    <!-- Menu Availability -->
    <section
      id="menuSection"
      class="panel"
      hidden>

      <h2>Menu Availability</h2>

      <p>
        Menu availability corresponds to
        <code>MenuItems.is_available</code>.
        Quantity-based inventory is not included in the
        current MySQL schema.
      </p>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Vendor</th>
              <th scope="col">Item</th>
              <th scope="col">Category</th>
              <th scope="col">Price</th>
              <th scope="col">Available</th>
              <th scope="col">Action</th>
            </tr>
          </thead>

          <tbody id="menuAdminBody">
          </tbody>

        </table>

      </div>

      <p
        id="menuMessage"
        aria-live="polite">
      </p>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
