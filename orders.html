<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Staff Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body data-page="orders">

  <main class="wireframe">

    <!-- Header -->
    <header>

      <b>Campus FoodLink+</b>

      <nav>

        <button
          id="showOrdersBtn"
          type="button">
          Orders
        </button>

        <button
          id="showMenuBtn"
          type="button">
          Menu Availability
        </button>

        <button
          id="studentDemoBtn"
          type="button"
          hidden>
          Student Demo
        </button>

        <button
          id="exportDataBtn"
          type="button">
          Export JSON
        </button>

        <button
          id="staffLogoutBtn"
          type="button">
          Logout
        </button>

      </nav>

    </header>


    <!-- Staff Information -->
    <section class="panel">

      <h2>Staff Dashboard</h2>

      <p>
        Welcome,
        <strong id="staffName"></strong>
      </p>

      <p>
        <strong>Role:</strong>
        <span id="staffRole"></span>
      </p>

    </section>


    <!-- Orders -->
    <section
      id="ordersSection"
      class="panel">

      <h2>Orders</h2>

      <table>

        <thead>

          <tr>
            <th>Order #</th>
            <th>Student</th>
            <th>Vendor</th>
            <th>Latest Status</th>
            <th>Pickup Time</th>
            <th>Update Status</th>
            <th>Details</th>
          </tr>

        </thead>

        <tbody id="ordersBody">
          <!-- Orders are loaded by app.js -->
        </tbody>

      </table>

      <p
        id="saveMessage"
        aria-live="polite">
      </p>

    </section>


    <!-- Menu Availability -->
    <section
      id="menuSection"
      class="panel"
      hidden>

      <h2>Menu Availability</h2>

      <p>
        Update which menu items are currently available
        for students to order.
      </p>

      <table>

        <thead>

          <tr>
            <th>Item ID</th>
            <th>Vendor</th>
            <th>Menu Item</th>
            <th>Category</th>
            <th>Price</th>
            <th>Available</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody id="menuAdminBody">
          <!-- Menu items are loaded by app.js -->
        </tbody>

      </table>

      <p
        id="menuMessage"
        aria-live="polite">
      </p>

    </section>

  </main>

  <script src="app.js"></script>

</body>

</html>
