<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vendor Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="menu">
<main class="wireframe">
  <header>
    <b>Campus FoodLink+</b>
    <a href="account.html">Dashboard</a>
  </header>

  <section class="panel">
    <label for="vendorSelect">Active Vendor:</label>
    <select id="vendorSelect">
      <option value="">Select a Vendor</option>
    </select>
    <div id="menuItems"></div>
  </section>

  <section class="panel">
    <h2>Order</h2>
    <table>
      <thead>
        <tr><th>Qty</th><th>Item</th><th>Unit Price</th><th>Total Price</th><th></th></tr>
      </thead>
      <tbody id="cartRows"></tbody>
    </table>

    <label for="specialInstructions">Special Instructions</label>
    <textarea id="specialInstructions" maxlength="255"></textarea>

    <label for="pickupTime">Pickup Time</label>
    <input id="pickupTime" type="datetime-local">

    <p>Order Total: $<b id="cartTotal">0.00</b></p>
    <p>Meal Plan Balance: $<b id="menuBalance"></b></p>
    <p id="orderMessage" aria-live="polite"></p>

    <button id="placeOrder" type="button">Confirm Order</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
