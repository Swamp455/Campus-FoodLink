<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Vendor Menu</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body data-page="menu">

  <main class="wireframe">

    <header class="menu-head">

      <span class="school-logo">
        Campus FoodLink+
      </span>

      <b>MENU</b>

      <a
        class="small-button"
        href="account.html"
      >
        Dashboard
      </a>

    </header>


    <div class="vendor-select">

      <label for="vendorSelect">
        Vendor:
      </label>

      <select id="vendorSelect">

        <option value="">
          Select a Vendor
        </option>

      </select>

    </div>


    <section
      id="menuItems"
      class="menu-items"
    >

      <p>
        Please select a vendor to view the menu.
      </p>

    </section>


    <aside class="cart-panel">

      <table>

        <thead>

          <tr>
            <th>Qty</th>
            <th>Item</th>
            <th>Price</th>
            <th>Remove</th>
          </tr>

        </thead>

        <tbody id="cartRows"></tbody>

      </table>


      <div class="pickup">

        <label for="pickupTime">
          <small>Pickup Time</small>
        </label>

        <select id="pickupTime">

          <option value="12:30 PM">
            12:30 PM
          </option>

          <option value="12:45 PM">
            12:45 PM
          </option>

          <option value="1:00 PM">
            1:00 PM
          </option>

        </select>

      </div>


      <p class="cart-total">

        Total:
        $<span id="cartTotal">0.00</span>

        🛒

      </p>


      <button
        id="placeOrder"
        type="button"
      >
        Confirm Order
      </button>

    </aside>

  </main>

  <script src="app.js"></script>

</body>
</html>
