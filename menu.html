<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Vendor Menu</title>

  <link rel="stylesheet" href="style.css">
</head>

<body data-page="menu">

  <main class="wireframe">

    <!-- Header -->
    <header>
      <b>Campus FoodLink+</b>

      <nav>
        <a href="account.html">Dashboard</a>
      </nav>
    </header>


    <!-- Vendor and Menu -->
    <section class="panel">

      <h2>Vendor Menu</h2>

      <label for="vendorSelect">
        <strong>Select Vendor:</strong>
      </label>

      <select id="vendorSelect">
        <option value="">Select a Vendor</option>
      </select>

      <!-- MenuItems are loaded here by app.js -->
      <div id="menuItems"></div>

    </section>


    <!-- Current Order -->
    <section class="panel">

      <h2>Your Order</h2>

      <table>

        <thead>
          <tr>
            <th>Qty</th>
            <th>Item</th>
            <th>Unit Price</th>
            <th>Total Price</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="cartRows">
          <!-- Cart items are loaded by app.js -->
        </tbody>

      </table>


      <!-- Special Instructions -->
      <label for="specialInstructions">
        <strong>Special Instructions:</strong>
      </label>

      <textarea
        id="specialInstructions"
        maxlength="255"
        placeholder="Enter any special instructions">
      </textarea>


      <!-- Pickup Time -->
      <label for="pickupTime">
        <strong>Pickup Time:</strong>
      </label>

      <input
        id="pickupTime"
        type="datetime-local"
        required
      >


      <!-- Order Summary -->
      <div class="order-summary">

        <p>
          <strong>Order Total:</strong>
          $<span id="cartTotal">0.00</span>
        </p>

        <p>
          <strong>Meal Plan Balance:</strong>
          $<span id="menuBalance">0.00</span>
        </p>

      </div>


      <!-- Submit Order -->
      <button
        id="placeOrder"
        type="button">
        Confirm Order
      </button>

    </section>

  </main>

  <script src="app.js"></script>

</body>

</html>
