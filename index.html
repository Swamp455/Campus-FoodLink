<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus FoodLink+ Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="login">

  <main class="wireframe">

    <h1 class="mini-logo">Campus FoodLink+</h1>

    <form id="loginForm" class="login-form">

      <label for="userId">Username</label>
      <input
        id="userId"
        name="userId"
        type="text"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <p id="loginError" class="error" aria-live="polite"></p>

      <button type="submit">Login</button>

    </form>

    <div class="demo-reset">
      <button id="resetDemoBtn" type="button">
        Reset Demo Data
      </button>

      <p id="resetMessage" aria-live="polite"></p>
    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>
