
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Campus FoodLink+ Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body data-page="login">

  <main class="wireframe">

    <!-- Campus FoodLink+ Branding -->
    <div class="login-branding">
        
    <img
      src="./Campus%20FoodLink%2B%20Logo.png"
      alt="Campus FoodLink+ Logo"
      class="login-logo"
    >    
    </div>

    <form id="loginForm" class="login-form">

      <!-- Select a login role before entering credentials -->
      <fieldset class="login-role-section">
        <legend>Select Account Type</legend>
        <p class="login-role-help">Choose the role assigned to your account.</p>
        <div class="login-role-grid">
          <label class="login-role-option"><input type="radio" name="loginRole" value="Student" checked><span>Student</span></label>
          <label class="login-role-option"><input type="radio" name="loginRole" value="IT Staff"><span>IT Staff</span></label>
          <label class="login-role-option"><input type="radio" name="loginRole" value="Dietary Associate"><span>Dietary Associate</span></label>
          <label class="login-role-option"><input type="radio" name="loginRole" value="Dietary Manager"><span>Dietary Manager</span></label>
        </div>
      </fieldset>


      <label for="userId">
        Username
      </label>

      <input
        id="userId"
        name="username"
        type="text"
        autocomplete="username"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <p class="hint">
        Account issues email itstaff@campus.edu to have your account updated
      </p>

      <p
        id="loginError"
        class="error"
        role="alert"
        aria-live="polite">
      </p>

      <button type="submit">
        Login
      </button>

    </form>

    <div class="demo-reset">

      <button
        id="resetDemoBtn"
        type="button">
        Reset Demo Data
      </button>

      <p
        id="resetMessage"
        aria-live="polite">
      </p>

    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>
