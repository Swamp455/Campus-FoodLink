<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Campus FoodLink+ Login
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body data-page="login">

  <main class="wireframe login-page">


    <!-- =====================================================
         CAMPUS FOODLINK+ LOGO
         ===================================================== -->

    <h1 class="mini-logo">
      Campus FoodLink+
    </h1>


    <div class="login-rule"></div>


    <!-- =====================================================
         LOGIN FORM
         ===================================================== -->

    <form
      id="loginForm"
      class="login-form"
    >


      <!-- USER ID -->

      <label for="userId">
        User ID:
      </label>

      <input
        id="userId"
        name="userId"
        type="text"
        value="aleon"
        autocomplete="username"
        required
      >


      <!-- PASSWORD -->

      <label for="password">
        Password:
      </label>

      <input
        id="password"
        name="password"
        type="password"
        value="password"
        autocomplete="current-password"
        required
      >


      <!-- LOGIN ERROR -->

      <p
        id="loginError"
        class="error"
        aria-live="polite"
      ></p>


      <!-- LOGIN BUTTONS -->

      <div class="login-actions">

        <button
          type="button"
          data-role="staff"
        >
          Staff Login
        </button>

        <button type="submit">
          Student Login
        </button>

      </div>


    </form>


  </main>


  <script src="app.js"></script>

</body>

</html>
